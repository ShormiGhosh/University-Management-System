<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - University Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/student.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Management</h1>
            <div>
                <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
            </div>
        </div>

        <div class="content">
            <div id="alertBox" class="alert"></div>
            
            <div class="action-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by name, roll number, email...">
                    <button class="btn btn-secondary" onclick="searchStudents()">Search</button>
                </div>
                <button class="btn btn-primary" onclick="openAddModal()">+ Add New Student</button>
            </div>

            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px;">Loading students...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Student Modal -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Student</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    
                    <div class="form-group">
                        <label for="rollNumber">Roll Number *</label>
                        <input type="text" id="rollNumber" required placeholder="Enter roll number">
                    </div>

                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" required placeholder="Enter student name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter email address">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label for="deptId">Department</label>
                        <select id="deptId">
                            <option value="">Select Department</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-success" onclick="saveStudent()">Save Student</button>
            </div>
        </div>
    </div>

    <script src="../js/student.js"></script>
</body>
</html>
