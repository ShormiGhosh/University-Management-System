<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - University Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/student.css">
</head>
<body>
<div class="container">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1 class="header-title">📚 Courses Management</h1>
        </div>
        <div class="header-right">
            <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- Alert Box -->
    <div id="alertBox" class="alert" style="display: none;"></div>

    <!-- Controls -->
    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search courses by name, code, department..." class="search-input">
            <button onclick="searchCourses()" class="btn btn-primary">Search</button>
        </div>
        <button onclick="openAddModal()" class="btn btn-success">+ Add Course</button>
    </div>

    <!-- Table Container -->
    <div id="tableContainer" class="table-wrapper">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading courses...</p>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div id="courseModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add New Course</h2>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <form id="courseForm" onsubmit="event.preventDefault(); saveCourse();">
            <input type="hidden" id="courseId">
            
            <div class="form-group">
                <label for="code">Course Code</label>
                <input type="text" id="code" class="form-control" placeholder="e.g., CS101">
            </div>

            <div class="form-group">
                <label for="name">Course Name <span class="required">*</span></label>
                <input type="text" id="name" class="form-control" placeholder="Enter course name" required>
            </div>

            <div class="form-group">
                <label for="credits">Credits</label>
                <input type="number" id="credits" class="form-control" placeholder="Enter credits" min="1" max="10">
            </div>

            <div class="form-group">
                <label for="deptId">Department</label>
                <select id="deptId" class="form-control">
                    <option value="">Select Department</option>
                </select>
            </div>

            <div class="form-group">
                <label for="teacherId">Teacher</label>
                <select id="teacherId" class="form-control">
                    <option value="">Select Teacher</option>
                </select>
            </div>

            <div class="modal-footer">
                <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Course</button>
            </div>
        </form>
    </div>
</div>

    <script src="../js/courses.js"></script>
</body>
</html>
