<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - University Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
    <!-- Top Navigation -->
    <header class="top-nav">
        <div class="nav-logo">
            <span class="nav-logo-text">UniManager</span>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="students.html" class="nav-item">Students</a>
            <a href="teachers.html" class="nav-item">Teachers</a>
            <a href="courses.html" class="nav-item">Courses</a>
            <a href="departments.html" class="nav-item active">Departments</a>
            <a href="#" class="nav-item" onclick="logout()">Logout</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Departments</h1>
            <p class="page-subtitle">Manage university departments</p>
            <button class="btn btn-primary" onclick="openAddModal()" id="addBtn" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add Department
            </button>
        </div>

        <div class="content-grid">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search departments..." id="searchInput" onkeyup="filterDepartments()">
            </div>

            <!-- Departments Table -->
            <div class="card">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="departmentsTableBody">
                        <tr>
                            <td colspan="4" class="loading">
                                <div class="spinner"></div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="departmentModal">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Add Department</h3>
            <button class="modal-close" onclick="closeModal('departmentModal')">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <form id="departmentForm" onsubmit="saveDepartment(event)">
            <div class="modal-body">
                <input type="hidden" id="departmentId">
                <div class="form-group">
                    <label class="form-label" for="name">Department Name *</label>
                    <input type="text" id="name" class="form-input" placeholder="Enter department name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" class="form-input" rows="3" placeholder="Enter description" style="resize: vertical;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('departmentModal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Department</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width: 400px;">
        <div class="modal-header">
            <h3 class="modal-title">Delete Department</h3>
            <button class="modal-close" onclick="closeModal('deleteModal')">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete this department? This action cannot be undone.</p>
            <input type="hidden" id="deleteDepartmentId">
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
            <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
