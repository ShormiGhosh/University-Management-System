<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - University Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
    <!-- Header -->
    <header class="top-header">
        <div class="header-user">
            <div class="user-avatar" id="userAvatar">T</div>
            <div class="user-info">
                <div class="user-name" id="userName">Teacher</div>
                <div class="user-role" id="userRole">Administrator</div>
            </div>
        </div>
        <div class="header-search">
            <input type="text" placeholder="Search courses..." id="searchInput" onkeyup="filterCourses()">
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="sidebar-logo-text">UniManager</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="students.html" class="nav-item">Students</a>
            <a href="teachers.html" class="nav-item">Teachers</a>
            <a href="courses.html" class="nav-item active">Courses</a>
            <a href="departments.html" class="nav-item">Departments</a>
            <a href="#" class="nav-item" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>Courses</h1>
            <button class="btn btn-primary" onclick="openAddModal()" id="addBtn" style="display: none;">Add Course</button>
        </div>
        <div id="alertContainer"></div>
        <div class="card">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Credits</th>
                    <th>Department</th>
                    <th>Teacher</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="coursesTableBody">
                <tr>
                    <td colspan="6" class="loading">
                        <div class="spinner"></div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="courseModal">
    <div class="modal">
        <h3 id="modalTitle">Add Course</h3>
        <form id="courseForm" onsubmit="saveCourse(event)">
            <input type="hidden" id="courseId">
            <label for="code">Course Code</label>
            <input type="text" id="code" placeholder="e.g., CS101">
            <label for="name">Course Name *</label>
            <input type="text" id="name" placeholder="Enter course name" required>
            <label for="credits">Credits</label>
            <input type="number" id="credits" placeholder="Enter credits" min="1" max="10">
            <label for="departmentId">Department</label>
            <select id="departmentId">
                <option value="">Select Department</option>
            </select>
            <label for="teacherId">Teacher</label>
            <select id="teacherId">
                <option value="">Select Teacher</option>
            </select>
            <button type="button" onclick="closeModal('courseModal')">Cancel</button>
            <button type="submit">Save Course</button>
        </form>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h3>Delete Course</h3>
        <p>Are you sure you want to delete this course?</p>
        <input type="hidden" id="deleteCourseId">
        <button type="button" onclick="closeModal('deleteModal')">Cancel</button>
        <button type="button" onclick="confirmDelete()">Delete</button>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
